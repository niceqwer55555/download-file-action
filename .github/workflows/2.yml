name: Download and Release2

on:
  workflow_dispatch:
    inputs:
      url:
        description: '文件链接'
        required: true
      filename:
        description: '保存文件名（可选，留空则用链接原名）'
        required: false
        default: ''
      password:
        description: '7z 压缩密码（必填，不能为空）'
        required: true

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Set timestamp tag
        id: tag
        run: echo "tag=v$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Validate password
        run: |
          if [ -z "${{ inputs.password }}" ]; then
            echo "密码不能为空"
            exit 1
          fi

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download
        run: |
          mkdir -p output
          cd output
          if [ -z "${{ inputs.filename }}" ]; then
            curl -fL -O "${{ inputs.url }}"
          else
            curl -fL -o "${{ inputs.filename }}" "${{ inputs.url }}"
          fi

      - name: Compress with 7z and password (split volumes)
        run: |
          cd output
          7z a -t7z -v1900m -p"${{ inputs.password }}" -mhe=on ../downloaded.7z . < /dev/null

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: downloaded.7z.*
          fail_on_unmatched_files: true