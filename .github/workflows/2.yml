name: Download and Release2

on:
  workflow_dispatch:
    inputs:
      url:
        description: '文件链接'
        required: true
      filename:
        description: '保存文件名（可选）'
        required: false
        default: 'file'

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Set timestamp tag
        id: tag
        run: echo "tag=v$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download
        run: |
          mkdir -p output
          cd output
          if [ -z "${{ inputs.filename }}" ]; then
            curl -L -O "${{ inputs.url }}"
          else
            curl -L -o "${{ inputs.filename }}" "${{ inputs.url }}"
          fi

      - name: Compress with 7z and password
        run: |
          cd output
          7z a -t7z -p"${{ secrets.ZIP_PASSWORD }}" -mhe=on ../downloaded.7z .

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: downloaded.7z
          fail_on_unmatched_files: true