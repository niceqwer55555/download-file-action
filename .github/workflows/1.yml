name: Download and Release

on:
  workflow_dispatch:
    inputs:
      url:
        description: '文件链接'
        required: true
      filename:
        description: '保存文件名（可选）'
        required: false
        default: 'file'
      tag:
        description: '目标 Tag 名称（如 v1.0.0）'
        required: true

permissions:
  contents: write   # 必须，否则无法创建 Release 或上传资产

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir -p output
          cd output
          if [ -z "${{ inputs.filename }}" ]; then
            curl -L -O "${{ inputs.url }}"
          else
            curl -L -o "${{ inputs.filename }}" "${{ inputs.url }}"
          fi

      - name: Compress
        run: |
          cd output
          zip -r ../downloaded.zip .

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: downloaded.zip
          fail_on_unmatched_files: true